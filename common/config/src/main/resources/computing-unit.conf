computing-unit {
  # local computing unit configuration
  local {
    enabled = true
    enabled = ${?COMPUTING_UNIT_LOCAL_ENABLED}
  }
  # TODO: move the kubernetes configuration to here

  # whether sharing computing unit is allowed or not
  sharing {
    enabled = false
    enabled = ${?COMPUTING_UNIT_SHARING_ENABLED}
  }

  # Public computing units: units an administrator creates that every user may run on. A public
  # unit runs one workflow at a time and queues the rest, so turning this off also removes the
  # queue -- there is nothing else that queues.
  public {
    enabled = false
    enabled = ${?COMPUTING_UNIT_PUBLIC_ENABLED}

    # How long one run may hold a public unit before the queue reclaims it, so a single wedged
    # workflow cannot block every other user indefinitely. 0 disables the watchdog.
    max-run-seconds = 0
    max-run-seconds = ${?COMPUTING_UNIT_PUBLIC_MAX_RUN_SECONDS}
  }
}