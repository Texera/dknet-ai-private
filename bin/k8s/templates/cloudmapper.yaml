{{- /*
  The CloudMapper microservice and its volume. Gated because it is not part of the
  platform: it needs AWS credentials and an SSH key, in Secrets named `aws-secret`
  and `ssh-key` that only bin/k8s/deploy_cloudmapper.sh creates, and its image lives
  outside this repository. Ungated it left a Pending pod on every cluster that had
  none of those, which also made `helm install --wait` time out.
*/ -}}
{{- if .Values.cloudmapper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudmapper
spec:
  replicas: 1
  # ReadWriteOnce PVC: replace the pod (kill-then-create) so the new pod isn't
  # blocked trying to attach the volume the old pod still holds (Multi-Attach).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudmapper
  template:
    metadata:
      labels:
        app: cloudmapper
    spec:
      volumes:
        - name: cloudmapper-file-volume
          persistentVolumeClaim:
            claimName: cloudmapper-pvc
        - name: aws-config-volume
          emptyDir: {}
        - name: ssh-key-volume
          secret:
            secretName: ssh-key
            defaultMode: 0600  # Secure SSH key permissions

      initContainers:
        - name: aws-config-setup
          image: ubuntu:22.04
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /aws-config;
              echo "[default]" > /aws-config/credentials;
              echo "aws_access_key_id = $AWS_ACCESS_KEY_ID" >> /aws-config/credentials;
              echo "aws_secret_access_key = $AWS_SECRET_ACCESS_KEY" >> /aws-config/credentials;
              echo "[default]" > /aws-config/config;
              echo "region = ${AWS_DEFAULT_REGION:-us-west-1}" >> /aws-config/config;
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION       # optional; defaults to us-west-1 if absent
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_DEFAULT_REGION
                  optional: true
          volumeMounts:
            - name: aws-config-volume
              mountPath: /aws-config

      containers:
        - name: cloudmapper
          image: kunwp1/cloudmapper:latest
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: cloudmapper-file-volume
              mountPath: "/data"
            - name: aws-config-volume
              mountPath: /root/.aws
            - name: ssh-key-volume
              mountPath: /root/.ssh
              readOnly: true

---
apiVersion: v1
kind: Service
metadata:
  name: cloudmapper-service
spec:
  selector:
    app: cloudmapper
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP

{{- end }}
