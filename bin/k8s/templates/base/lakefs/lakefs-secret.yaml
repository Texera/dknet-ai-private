{{- /*
  lakeFS's SigV4 parser (pkg/gateway/sig/v4.go) bounds the access key id at 3-20 characters.
  A longer one never matches the Authorization header's regex, so V4 declines, the V2
  authenticator is tried on a V4-shaped header, and lakeFS answers MissingFields -- which
  reads as a malformed request, not a misconfiguration. Nothing else breaks: the native REST
  API does a direct credential lookup and never parses a signature, so uploads keep working
  and a deployment can be fully populated before anyone discovers that nothing can mount.
  Refuse at render time instead, where the cause is still visible.
*/ -}}
{{- $accessKey := .Values.lakefs.auth.accessKey | toString -}}
{{- if or (lt (len $accessKey) 3) (gt (len $accessKey) 20) -}}
{{- fail (printf "lakefs.auth.accessKey must be 3-20 characters (lakeFS's SigV4 limit); got %d. A longer key leaves every S3-gateway request failing with MissingFields, so no repository can be mounted, while the REST API keeps working and hides it. Use an AWS-shaped key, e.g. AKIA + 16 alphanumerics." (len $accessKey)) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-lakefs-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ .Values.lakefs.auth.username | quote }}
  access_key: {{ .Values.lakefs.auth.accessKey | quote }}
  secret_key: {{ .Values.lakefs.auth.secretKey | quote }}
